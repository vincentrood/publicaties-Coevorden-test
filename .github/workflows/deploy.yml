name: S3 PDF documenten ophalen en website bouwen

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      folder:
        description: "Submap om te synchroniseren (bijv. 2024)"
        required: false
        default: "2020"
      force_rebuild:
        description: "Forceer volledige rebuild (true/false)"
        required: false
        default: "false"

env:
  SYNC_FOLDER: ${{ github.event.inputs.folder || '2020' }}
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Dependencies ──────────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils jq

      # ── 3. S3 → Markdown sync ────────────────────────────────────────────────
      - name: Sync S3 → Markdown
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BUCKET_NAME:           publicaties-coevorden
        run: |
          set -euo pipefail
          mkdir -p "docs/$SYNC_FOLDER"

          echo "📥 S3-listing ophalen voor map: $SYNC_FOLDER..."

          # Pagineer door alle objecten en verzamel alleen PDF-sleutels
          > s3_list.txt
          TOKEN=""
          while : ; do
            ARGS=(--bucket "$BUCKET_NAME" --prefix "$SYNC_FOLDER/" --max-items 1000)
            [ -n "$TOKEN" ] && ARGS+=(--starting-token "$TOKEN")

            RESPONSE=$(aws s3api list-objects-v2 "${ARGS[@]}")
            echo "$RESPONSE" | jq -r '.Contents[]? | .Key' | grep -i '\.pdf$' >> s3_list.txt || true
            TOKEN=$(echo "$RESPONSE" | jq -r '.NextToken // empty')
            [ -z "$TOKEN" ] && break
          done
          sort -u s3_list.txt -o s3_list.txt
          PDF_COUNT=$(wc -l < s3_list.txt)
          echo "📊 $PDF_COUNT PDF('s) gevonden in $SYNC_FOLDER"

          # Verwijder markdown-bestanden waarvan de PDF niet meer in S3 staat
          echo "🧹 Verwijderd stale bestanden uit docs/$SYNC_FOLDER..."
          find "docs/$SYNC_FOLDER" -name "*.md" -print0 | while IFS= read -r -d '' md_path; do
            expected_pdf="${md_path#docs/}"
            expected_pdf="${expected_pdf%.md}.pdf"
            if ! grep -Fxq "$expected_pdf" s3_list.txt; then
              echo "  ❌ Verwijderd: $md_path"
              rm "$md_path"
            fi
          done

          # Verwerk nieuwe PDF's naar markdown
          echo "➕ Nieuwe PDF's verwerken..."

          process_file() {
            local pdf_key="$1"
            local md_path="docs/${pdf_key%.pdf}.md"

            # Sla over als markdown al bestaat (inhoud wordt later gehasht door process-woo)
            [ -f "$md_path" ] && return

            echo "  🆕 $pdf_key"
            mkdir -p "$(dirname "$md_path")"
            local tmpfile
            tmpfile=$(mktemp --suffix=.pdf)

            if aws s3 cp "s3://$BUCKET_NAME/$pdf_key" "$tmpfile" --quiet 2>/dev/null; then
              local filename
              filename=$(basename "${pdf_key%.pdf}")
              # Verwijder aanhalingstekens uit bestandsnaam voor veilige YAML
              local clean_title
              clean_title=$(echo "$filename" | tr '"' "'" | tr '\n' ' ' | xargs)

              # Bouw taxonomy-lijst op basis van mapstructuur
              local relative_path="${pdf_key%.pdf}"
              IFS='/' read -ra parts <<< "$relative_path"
              local taxo=()
              for ((i=0; i<${#parts[@]}-1; i++)); do
                taxo+=("\"${parts[$i]}\"")
              done
              local taxonomy_list
              taxonomy_list=$(IFS=,; echo "${taxo[*]}")

              # Schrijf frontmatter + PDF-tekst
              {
                printf -- "---\n"
                printf 'title: "%s"\n'  "$clean_title"
                printf 'maps: [%s]\n'   "$taxonomy_list"
                printf 'source: "%s"\n' "$pdf_key"
                printf 'date: %s\n'     "$(date +%Y-%m-%d)"
                printf -- "---\n\n"
                # -layout geeft betere tekstordening dan -raw bij de meeste gemeentedocumenten
                pdftotext -layout "$tmpfile" - 2>/dev/null | tr -d '\000' || true
              } > "$md_path"
            else
              echo "  ⚠️  Download mislukt: $pdf_key"
            fi

            rm -f "$tmpfile"
          }

          export -f process_file
          export BUCKET_NAME

          # Maximaal 4 parallelle downloads — sneller dan 1, veilig voor S3-limieten
          tr '\n' '\0' < s3_list.txt | xargs -0 -I {} -P 4 bash -c 'process_file "$@"' _ {}

      # ── 4. Commit nieuwe/gewijzigde markdown ─────────────────────────────────
      - name: Commit markdown wijzigingen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: S3 → docs/${{ env.SYNC_FOLDER }}"
          file_pattern: "docs/${{ env.SYNC_FOLDER }}/**"

      # ── 5. Hugo build ────────────────────────────────────────────────────────
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2

      - name: Build Hugo site
        run: |
          set -euo pipefail
          TARGET="content/docs/$SYNC_FOLDER"
          mkdir -p "$TARGET"
          # Kopieer alleen de gesyncte map naar Hugo content
          rsync -a --delete "docs/$SYNC_FOLDER/" "$TARGET/"
          hugo --minify --baseURL "https://publicaties-coevorden-site.s3.eu-north-1.amazonaws.com/$SYNC_FOLDER/"

      # ── 6. Zoekindex ─────────────────────────────────────────────────────────
      - name: Index met Pagefind
        run: npx pagefind@latest --site public --output-subdir _pagefind

      # ── 7. Deploy naar S3 ────────────────────────────────────────────────────
      - name: Deploy naar S3
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID_SITE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_SITE }}
          BUCKET_NAME:           publicaties-coevorden-site
        run: |
          aws s3 sync ./public "s3://$BUCKET_NAME/$SYNC_FOLDER" \
            --delete \
            --cache-control "public, max-age=300" \
            --exclude "*.html" \
            --exclude "_pagefind/*"

          # HTML en zoekindex apart zonder cache zodat updates direct zichtbaar zijn
          aws s3 sync ./public "s3://$BUCKET_NAME/$SYNC_FOLDER" \
            --exclude "*" \
            --include "*.html" \
            --include "_pagefind/*" \
            --cache-control "no-cache, no-store, must-revalidate"

          echo "🚀 Deploy voltooid naar s3://$BUCKET_NAME/$SYNC_FOLDER"
